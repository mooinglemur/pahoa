[package]
name = "pahoa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Archipelago multiworld server"
default-run = "pahoa"

[features]
default = ["mimalloc"]
# musl's allocator degrades badly under multithreaded allocation pressure, and
# this workload is exactly that (a JSON encode per broadcast, per-connection
# deflate buffers). Off by default only for builds that cannot take the C
# dependency.
mimalloc = ["dep:mimalloc"]

[dependencies]
pahoa-multidata = { path = "../pahoa-multidata" }
pahoa-pickle = { path = "../pahoa-pickle" }
pahoa-pyrandom = { path = "../pahoa-pyrandom" }
mimalloc = { version = "0.1", default-features = false, optional = true }
