[package]
name = "pahoa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Archipelago multiworld server"
default-run = "pahoa"

[features]
default = ["mimalloc"]
# musl's allocator degrades badly under multithreaded allocation pressure, and
# this workload is exactly that (a JSON encode per broadcast, per-connection
# deflate buffers). Off by default only for builds that cannot take the C
# dependency.
mimalloc = ["dep:mimalloc"]

[dependencies]
pahoa-multidata = { path = "../pahoa-multidata" }
pahoa-net = { path = "../pahoa-net" }
pahoa-proto = { path = "../pahoa-proto" }
pahoa-room = { path = "../pahoa-room" }
tokio = { version = "1", features = ["signal", "rt"] }
pahoa-pickle = { path = "../pahoa-pickle" }
pahoa-pyrandom = { path = "../pahoa-pyrandom" }
mimalloc = { version = "0.1", default-features = false, optional = true }
# `PAHOA_SLOT_PASSWORDS` arrives as JSON.
serde_json = "1"
tracing = "0.1"
# Deliberately not `env-filter`: it pulls `regex` and its automata tables into a
# binary that keeps its dependency list thin on purpose, and the only filtering
# pahoa offers is a single global level from `--log-level`.
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "ansi",
    # --log-format json. Pulls `tracing-serde` and leans on the `serde_json`
    # already in the tree, which is why this is cheap where `env-filter` (and
    # its `regex` automata) was not.
    "json",
    # rustls reports through the `log` crate, not `tracing`. Without this bridge
    # every one of its diagnostics is discarded — including the ones that say
    # why a handshake failed, which is the first thing anyone wants when TLS is
    # misbehaving.
    "tracing-log",
] }
