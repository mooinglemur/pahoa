[package]
name = "pahoa-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Archipelago network protocol types and JSON codec"

[dependencies]
pahoa-multidata = { path = "../pahoa-multidata" }
serde = { version = "1", features = ["derive"] }
# preserve_order is REQUIRED, not a preference: Python dicts keep insertion order
# and that order is directly observable in the Retrieved/SetReply payloads we
# echo back to clients. Without it serde_json::Value is a BTreeMap and every
# data-storage value silently gets reordered on the wire.
#
# arbitrary_precision is required for the same reason and with the same force.
# Python's ints are unbounded, and a client storing a bitfield wider than 64
# bits is not hypothetical: one reached a live room. Without this, serde_json
# folds any integer literal past u64 into an f64 *during parsing*, so the digits
# are gone before the room sees the packet: `2361183241434822606848` came back
# as `2.3611832414348226e+21`, silently, with no error anywhere. See
# `docs/numbers.md` for what it costs in exchange.
serde_json = { version = "1", features = [
    "preserve_order",
    "raw_value",
    "arbitrary_precision",
] }
thiserror.workspace = true
