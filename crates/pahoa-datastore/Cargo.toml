[package]
name = "pahoa-datastore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Python-compatible data storage operations for Archipelago"

[dependencies]
# Both features carry protocol meaning rather than being preferences, and both
# are explained at length in `pahoa-proto/Cargo.toml`. Repeated here rather than
# inherited through feature unification because this crate does not depend on
# `pahoa-proto`: `cargo test -p pahoa-datastore` would otherwise compile a
# serde_json that rounds a client's bitfield to a float, and the vectors here
# would be measuring a build nothing ships.
serde_json = { version = "1", features = [
    "preserve_order",
    "arbitrary_precision",
] }
thiserror.workspace = true

# Python's ints are unbounded and clients rely on it — a world storing its
# location checks as a 71-bit bitfield reached a live room, and every `or` that
# set a bit was refused. This is the one place in pahoa where a dependency beats
# hand-rolling: two's-complement bitwise operations over sign-magnitude limbs,
# floored division and shortest-round-trip decimal rendering of a 20,000-digit
# number are each a subtle algorithm, and the whole point of the exercise is to
# be *exactly* right. Pure Rust, no build script, builds static-musl.
num-bigint = { version = "0.4", default-features = false, features = ["std"] }
num-traits = { version = "0.2", default-features = false, features = ["std"] }
